<div class="form-container">
  <div class="form-card">
    <h1>Add New Customer</h1>
    <p class="subtitle">Complete KYC onboarding for a new customer</p>

    <form (ngSubmit)="onSubmit()" #customerForm="ngForm">
      <div *ngIf="error" class="error-message">
        {{ error }}
      </div>

      <div class="form-section">
        <h3>Personal Information</h3>
        
        <div class="form-group">
          <label for="fullName">Full Name *</label>
          <input 
            type="text" 
            id="fullName" 
            name="fullName"
            [(ngModel)]="customer.fullName"
            required
            placeholder="Enter full name">
        </div>

        <div class="form-group">
          <label for="email">Email *</label>
          <input 
            type="email" 
            id="email" 
            name="email"
            [(ngModel)]="customer.email"
            required
            placeholder="email@example.com">
        </div>

        <div class="form-group">
          <label for="phoneNumber">Phone Number</label>
          <input 
            type="tel" 
            id="phoneNumber" 
            name="phoneNumber"
            [(ngModel)]="customer.phoneNumber"
            placeholder="+1-555-0000">
        </div>
      </div>

      <div class="form-section">
        <h3>Company Information</h3>
        
        <div class="form-group">
          <label for="companyName">Company Name *</label>
          <input 
            type="text" 
            id="companyName" 
            name="companyName"
            [(ngModel)]="customer.companyName"
            required
            placeholder="Enter company name">
        </div>

        <div class="form-group">
          <label for="businessNumber">Business Number</label>
          <input 
            type="text" 
            id="businessNumber" 
            name="businessNumber"
            [(ngModel)]="customer.businessNumber"
            placeholder="Registration number">
        </div>

        <div class="form-group">
          <label for="country">Country *</label>
          <select 
            id="country" 
            name="country"
            [(ngModel)]="customer.country"
            required>
            <option value="">Select a country</option>
            <option value="United States">United States</option>
            <option value="United Kingdom">United Kingdom</option>
            <option value="Denmark">Denmark</option>
            <option value="Norway">Norway</option>
            <option value="Sweden">Sweden</option>
            <option value="Germany">Germany</option>
            <option value="France">France</option>
            <option value="Spain">Spain</option>
            <option value="Netherlands">Netherlands</option>
            <option value="Belgium">Belgium</option>
          </select>
        </div>

        <div class="form-group">
          <label for="address">Address</label>
          <textarea 
            id="address" 
            name="address"
            [(ngModel)]="customer.address"
            rows="3"
            placeholder="Enter full address"></textarea>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-secondary" (click)="cancel()">
          Cancel
        </button>
        <button 
          type="submit" 
          class="btn-primary" 
          [disabled]="!isValid() || submitting">
          {{ submitting ? 'Creating...' : 'Create Customer' }}
        </button>
      </div>
    </form>
  </div>
</div>
